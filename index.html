<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Công cụ Tạo Rubric và Đo Lường Chuẩn Đầu Ra</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="https://unpkg.com/html-docx-js@0.3.1/dist/html-docx.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const App = () => {
      const [rubricType, setRubricType] = useState("analytic");
      const [rubricTitle, setRubricTitle] = useState("");
      const [criteria, setCriteria] = useState([]);
      const [levels, setLevels] = useState([]);
      const [maxScore, setMaxScore] = useState(4);
      const [outcomes, setOutcomes] = useState([]);
      const [students, setStudents] = useState([]);
      const [studentScores, setStudentScores] = useState({});
      const [activeTab, setActiveTab] = useState("design");
      const [passingThreshold, setPassingThreshold] = useState(60);
      const [showOutcomeForm, setShowOutcomeForm] = useState(false);
      const [showStudentForm, setShowStudentForm] = useState(false);
      const [newOutcome, setNewOutcome] = useState({ code: "", description: "", relatedCriteria: [] });
      const [newStudent, setNewStudent] = useState({ fullName: "", studentId: "" });
      const [showRubricTemplates, setShowRubricTemplates] = useState(false);

      useEffect(() => {
        const savedRubricType = localStorage.getItem("rubricType");
        const savedRubricTitle = localStorage.getItem("rubricTitle");
        const savedCriteria = JSON.parse(localStorage.getItem("criteria")) || [];
        const savedLevels = JSON.parse(localStorage.getItem("levels")) || [];
        const savedMaxScore = JSON.parse(localStorage.getItem("maxScore")) || 4;
        const savedOutcomes = JSON.parse(localStorage.getItem("outcomes")) || [];
        const savedStudents = JSON.parse(localStorage.getItem("students")) || [];
        const savedStudentScores = JSON.parse(localStorage.getItem("studentScores")) || {};
        const savedPassingThreshold = JSON.parse(localStorage.getItem("passingThreshold")) || 60;

        if (savedRubricType) setRubricType(savedRubricType);
        if (savedRubricTitle) setRubricTitle(savedRubricTitle);
        if (savedCriteria.length) setCriteria(savedCriteria);
        if (savedLevels.length) setLevels(savedLevels);
        if (savedMaxScore) setMaxScore(savedMaxScore);
        if (savedOutcomes.length) setOutcomes(savedOutcomes);
        if (savedStudents.length) setStudents(savedStudents);
        if (Object.keys(savedStudentScores).length) setStudentScores(savedStudentScores);
        if (savedPassingThreshold) setPassingThreshold(savedPassingThreshold);
      }, []);

      const rubricTemplates = {
        C1: {
          title: "Rubric C1 - Đánh giá bài viết luận",
          type: "analytic",
          criteria: [
            { name: "Nội dung", weight: 40, descriptions: ["Chưa đạt yêu cầu", "Đạt yêu cầu cơ bản", "Tốt", "Xuất sắc"], relatedOutcomes: [] },
            { name: "Cấu trúc", weight: 30, descriptions: ["Chưa đạt yêu cầu", "Đạt yêu cầu cơ bản", "Tốt", "Xuất sắc"], relatedOutcomes: [] },
            { name: "Ngôn ngữ", weight: 30, descriptions: ["Chưa đạt yêu cầu", "Đạt yêu cầu cơ bản", "Tốt", "Xuất sắc"], relatedOutcomes: [] },
          ],
          levels: ["Chưa đạt yêu cầu", "Đạt yêu cầu cơ bản", "Tốt", "Xuất sắc"],
          maxScore: 4,
        },
        C2: {
          title: "Rubric C2 - Đánh giá thuyết trình",
          type: "holistic",
          criteria: [
            { name: "Thuyết trình", weight: 100, descriptions: ["Yếu", "Trung bình", "Khá", "Tốt"], relatedOutcomes: [] },
          ],
          levels: ["Yếu", "Trung bình", "Khá", "Tốt"],
          maxScore: 4,
        },
        C3: {
          title: "Rubric C3 - Đánh giá kỹ năng lập trình",
          type: "analytic",
          criteria: [
            { name: "Logic chương trình", weight: 50, descriptions: ["Không chạy được", "Chạy nhưng lỗi", "Chạy đúng nhưng chưa tối ưu", "Tối ưu"], relatedOutcomes: [] },
            { name: "Cú pháp", weight: 30, descriptions: ["Nhiều lỗi cú pháp", "Một vài lỗi nhỏ", "Cú pháp đúng", "Cú pháp hoàn hảo"], relatedOutcomes: [] },
            { name: "Giao diện", weight: 20, descriptions: ["Không có giao diện", "Giao diện cơ bản", "Giao diện thân thiện", "Giao diện xuất sắc"], relatedOutcomes: [] },
          ],
          levels: ["Không đạt", "Đạt cơ bản", "Tốt", "Xuất sắc"],
          maxScore: 4,
        },
        C4: {
          title: "Rubric C4 - Đánh giá dự án nhóm",
          type: "analytic",
          criteria: [
            { name: "Hợp tác nhóm", weight: 30, descriptions: ["Không tham gia", "Tham gia hạn chế", "Tham gia tích cực", "Lãnh đạo nhóm"], relatedOutcomes: [] },
            { name: "Kết quả dự án", weight: 40, descriptions: ["Không đạt", "Đạt yêu cầu tối thiểu", "Tốt", "Xuất sắc"], relatedOutcomes: [] },
            { name: "Báo cáo", weight: 30, descriptions: ["Không nộp", "Báo cáo sơ sài", "Báo cáo đầy đủ", "Báo cáo chuyên nghiệp"], relatedOutcomes: [] },
          ],
          levels: ["Không đạt", "Đạt tối thiểu", "Tốt", "Xuất sắc"],
          maxScore: 4,
        },
        C5: {
          title: "Rubric C5 - Đánh giá phân tích dữ liệu",
          type: "analytic",
          criteria: [
            { name: "Thu thập dữ liệu", weight: 30, descriptions: ["Không đủ dữ liệu", "Dữ liệu cơ bản", "Dữ liệu đầy đủ", "Dữ liệu chất lượng cao"], relatedOutcomes: [] },
            { name: "Phân tích", weight: 40, descriptions: ["Không phân tích", "Phân tích sơ sài", "Phân tích đúng", "Phân tích sâu sắc"], relatedOutcomes: [] },
            { name: "Trình bày kết quả", weight: 30, descriptions: ["Không rõ ràng", "Trình bày cơ bản", "Trình bày rõ ràng", "Trình bày ấn tượng"], relatedOutcomes: [] },
          ],
          levels: ["Không đạt", "Đạt cơ bản", "Tốt", "Xuất sắc"],
          maxScore: 4,
        },
        C6: {
          title: "Rubric C6 - Đánh giá bài kiểm tra",
          type: "holistic",
          criteria: [
            { name: "Bài kiểm tra", weight: 100, descriptions: ["Yếu", "Trung bình", "Khá", "Tốt"], relatedOutcomes: [] },
          ],
          levels: ["Yếu", "Trung bình", "Khá", "Tốt"],
          maxScore: 4,
        },
        C7: {
          title: "Rubric C7 - Đánh giá kỹ năng giao tiếp",
          type: "analytic",
          criteria: [
            { name: "Ngôn ngữ cơ thể", weight: 30, descriptions: ["Không phù hợp", "Cơ bản", "Tự nhiên", "Chuyên nghiệp"], relatedOutcomes: [] },
            { name: "Nội dung giao tiếp", weight: 40, descriptions: ["Không rõ ràng", "Cơ bản", "Rõ ràng", "Thuyết phục"], relatedOutcomes: [] },
            { name: "Tương tác", weight: 30, descriptions: ["Không tương tác", "Tương tác hạn chế", "Tương tác tốt", "Tương tác xuất sắc"], relatedOutcomes: [] },
          ],
          levels: ["Không đạt", "Đạt cơ bản", "Tốt", "Xuất sắc"],
          maxScore: 4,
        },
        C8: {
          title: "Rubric C8 - Đánh giá báo cáo nghiên cứu",
          type: "analytic",
          criteria: [
            { name: "Phương pháp nghiên cứu", weight: 40, descriptions: ["Không rõ ràng", "Cơ bản", "Phù hợp", "Sáng tạo"], relatedOutcomes: [] },
            { name: "Kết quả", weight: 30, descriptions: ["Không đạt", "Đạt tối thiểu", "Tốt", "Xuất sắc"], relatedOutcomes: [] },
            { name: "Trình bày", weight: 30, descriptions: ["Không rõ ràng", "Cơ bản", "Chuyên nghiệp", "Ấn tượng"], relatedOutcomes: [] },
          ],
          levels: ["Không đạt", "Đạt cơ bản", "Tốt", "Xuất sắc"],
          maxScore: 4,
        },
        C9: {
          title: "Rubric C9 - Đánh giá kỹ năng giải quyết vấn đề",
          type: "holistic",
          criteria: [
            { name: "Giải quyết vấn đề", weight: 100, descriptions: ["Yếu", "Trung bình", "Khá", "Tốt"], relatedOutcomes: [] },
          ],
          levels: ["Yếu", "Trung bình", "Khá", "Tốt"],
          maxScore: 4,
        },
        C10: {
          title: "Rubric C10 - Đánh giá bài tập thực hành",
          type: "analytic",
          criteria: [
            { name: "Kỹ năng thực hành", weight: 50, descriptions: ["Không đạt", "Đạt cơ bản", "Tốt", "Xuất sắc"], relatedOutcomes: [] },
            { name: "Kết quả", weight: 30, descriptions: ["Không đạt", "Đạt tối thiểu", "Tốt", "Xuất sắc"], relatedOutcomes: [] },
            { name: "Báo cáo", weight: 20, descriptions: ["Không nộp", "Sơ sài", "Đầy đủ", "Chuyên nghiệp"], relatedOutcomes: [] },
          ],
          levels: ["Không đạt", "Đạt cơ bản", "Tốt", "Xuất sắc"],
          maxScore: 4,
        },
        C11: {
          title: "Rubric C11 - Đánh giá kỹ năng lãnh đạo",
          type: "analytic",
          criteria: [
            { name: "Khả năng lãnh đạo", weight: 40, descriptions: ["Không thể hiện", "Cơ bản", "Tốt", "Xuất sắc"], relatedOutcomes: [] },
            { name: "Tầm nhìn", weight: 30, descriptions: ["Không rõ ràng", "Cơ bản", "Rõ ràng", "Sáng tạo"], relatedOutcomes: [] },
            { name: "Tương tác nhóm", weight: 30, descriptions: ["Không tương tác", "Hạn chế", "Tốt", "Xuất sắc"], relatedOutcomes: [] },
          ],
          levels: ["Không đạt", "Đạt cơ bản", "Tốt", "Xuất sắc"],
          maxScore: 4,
        },
        C12: {
          title: "Rubric C12 - Đánh giá bài thuyết trình nhóm",
          type: "holistic",
          criteria: [
            { name: "Thuyết trình nhóm", weight: 100, descriptions: ["Yếu", "Trung bình", "Khá", "Tốt"], relatedOutcomes: [] },
          ],
          levels: ["Yếu", "Trung bình", "Khá", "Tốt"],
          maxScore: 4,
        },
      };

      const loadRubricTemplate = (templateKey) => {
        const template = rubricTemplates[templateKey];
        setRubricType(template.type);
        setRubricTitle(template.title);
        setCriteria(template.criteria);
        setLevels(template.levels);
        setMaxScore(template.maxScore);

        localStorage.setItem("rubricType", template.type);
        localStorage.setItem("rubricTitle", template.title);
        localStorage.setItem("criteria", JSON.stringify(template.criteria));
        localStorage.setItem("levels", JSON.stringify(template.levels));
        localStorage.setItem("maxScore", JSON.stringify(template.maxScore));

        setShowRubricTemplates(false);
      };

      const addCriterion = () => {
        const newCriterion = {
          name: `Tiêu chí ${criteria.length + 1}`,
          weight: rubricType === "holistic" ? 100 : 10,
          descriptions: levels.map(() => ""),
          relatedOutcomes: [],
        };
        const newCriteria = [...criteria, newCriterion];
        setCriteria(newCriteria);
        localStorage.setItem("criteria", JSON.stringify(newCriteria));
      };

      const updateCriterion = (index, field, value) => {
        const newCriteria = [...criteria];
        newCriteria[index][field] = value;
        setCriteria(newCriteria);
        localStorage.setItem("criteria", JSON.stringify(newCriteria));
      };

      const updateCriterionDescription = (criterionIndex, levelIndex, value) => {
        const newCriteria = [...criteria];
        newCriteria[criterionIndex].descriptions[levelIndex] = value;
        setCriteria(newCriteria);
        localStorage.setItem("criteria", JSON.stringify(newCriteria));
      };

      const removeCriterion = (index) => {
        const newCriteria = criteria.filter((_, i) => i !== index);
        setCriteria(newCriteria);
        localStorage.setItem("criteria", JSON.stringify(newCriteria));
      };

      const addLevel = () => {
        const newLevel = `Mức ${levels.length + 1}`;
        const newLevels = [...levels, newLevel];
        setLevels(newLevels);
        setMaxScore(levels.length + 1);
        const newCriteria = criteria.map((criterion) => ({
          ...criterion,
          descriptions: [...criterion.descriptions, ""],
        }));
        setCriteria(newCriteria);
        localStorage.setItem("levels", JSON.stringify(newLevels));
        localStorage.setItem("maxScore", JSON.stringify(levels.length + 1));
        localStorage.setItem("criteria", JSON.stringify(newCriteria));
      };

      const updateLevel = (index, value) => {
        const newLevels = [...levels];
        newLevels[index] = value;
        setLevels(newLevels);
        localStorage.setItem("levels", JSON.stringify(newLevels));
      };

      const removeLevel = (index) => {
        const newLevels = levels.filter((_, i) => i !== index);
        setLevels(newLevels);
        setMaxScore(newLevels.length);
        const newCriteria = criteria.map((criterion) => ({
          ...criterion,
          descriptions: criterion.descriptions.filter((_, i) => i !== index),
        }));
        setCriteria(newCriteria);
        localStorage.setItem("levels", JSON.stringify(newLevels));
        localStorage.setItem("maxScore", JSON.stringify(newLevels.length));
        localStorage.setItem("criteria", JSON.stringify(newCriteria));
      };

      const addOutcome = () => {
        if (!newOutcome.code || !newOutcome.description) {
          alert("Vui lòng nhập mã và mô tả chuẩn đầu ra!");
          return;
        }
        const newOutcomeObj = {
          id: outcomes.length + 1,
          code: newOutcome.code,
          description: newOutcome.description,
          relatedCriteria: [],
        };
        const newOutcomes = [...outcomes, newOutcomeObj];
        setOutcomes(newOutcomes);
        localStorage.setItem("outcomes", JSON.stringify(newOutcomes));
        setNewOutcome({ code: "", description: "", relatedCriteria: [] });
        setShowOutcomeForm(false);
      };

      const updateOutcome = (id, field, value) => {
        const newOutcomes = outcomes.map((outcome) =>
          outcome.id === id ? { ...outcome, [field]: value } : outcome
        );
        setOutcomes(newOutcomes);
        localStorage.setItem("outcomes", JSON.stringify(newOutcomes));
      };

      const removeOutcome = (id) => {
        const newOutcomes = outcomes.filter((outcome) => outcome.id !== id);
        setOutcomes(newOutcomes);
        localStorage.setItem("outcomes", JSON.stringify(newOutcomes));

        const newCriteria = criteria.map((criterion) => ({
          ...criterion,
          relatedOutcomes: criterion.relatedOutcomes.filter((outcomeId) => outcomeId !== id),
        }));
        setCriteria(newCriteria);
        localStorage.setItem("criteria", JSON.stringify(newCriteria));
      };

      const updateCriterionOutcomes = (criterionIndex, outcomeId, isChecked) => {
        const newCriteria = [...criteria];
        if (!newCriteria[criterionIndex].relatedOutcomes) {
          newCriteria[criterionIndex].relatedOutcomes = [];
        }
        if (isChecked) {
          newCriteria[criterionIndex].relatedOutcomes = [
            ...newCriteria[criterionIndex].relatedOutcomes,
            outcomeId,
          ];
        } else {
          newCriteria[criterionIndex].relatedOutcomes = newCriteria[criterionIndex].relatedOutcomes.filter(
            (id) => id !== outcomeId
          );
        }
        setCriteria(newCriteria);
        localStorage.setItem("criteria", JSON.stringify(newCriteria));

        const newOutcomes = outcomes.map((outcome) => {
          if (outcome.id === outcomeId) {
            if (isChecked) {
              return { ...outcome, relatedCriteria: [...outcome.relatedCriteria, criterionIndex] };
            } else {
              return {
                ...outcome,
                relatedCriteria: outcome.relatedCriteria.filter((idx) => idx !== criterionIndex),
              };
            }
          }
          return outcome;
        });
        setOutcomes(newOutcomes);
        localStorage.setItem("outcomes", JSON.stringify(newOutcomes));
      };

      const addStudent = () => {
        if (!newStudent.fullName || !newStudent.studentId) {
          alert("Vui lòng nhập họ tên và mã số sinh viên!");
          return;
        }
        const newStudentObj = {
          id: students.length + 1,
          fullName: newStudent.fullName,
          studentId: newStudent.studentId,
        };
        const newStudents = [...students, newStudentObj];
        setStudents(newStudents);
        localStorage.setItem("students", JSON.stringify(newStudents));
        setStudentScores({
          ...studentScores,
          [newStudentObj.id]: rubricType === "holistic" ? { level: "" } : {},
        });
        setNewStudent({ fullName: "", studentId: "" });
        setShowStudentForm(false);
      };

      const removeStudent = (studentId) => {
        const newStudents = students.filter((student) => student.id !== studentId);
        setStudents(newStudents);
        localStorage.setItem("students", JSON.stringify(newStudents));
        const newStudentScores = { ...studentScores };
        delete newStudentScores[studentId];
        setStudentScores(newStudentScores);
        localStorage.setItem("studentScores", JSON.stringify(newStudentScores));
      };

      const updateStudentScore = (studentId, criterionIndex, value) => {
        const parsedValue = parseFloat(value);
        if (isNaN(parsedValue) || parsedValue < 0 || (rubricType === "analytic" && parsedValue > maxScore)) {
          alert("Điểm không hợp lệ! Vui lòng nhập số từ 0 đến " + maxScore);
          return;
        }
        const updatedScores = { ...studentScores };
        if (rubricType === "holistic") {
          updatedScores[studentId] = { level: value };
        } else {
          updatedScores[studentId] = {
            ...updatedScores[studentId],
            [criterionIndex]: parsedValue,
          };
        }
        setStudentScores(updatedScores);
        localStorage.setItem("studentScores", JSON.stringify(updatedScores));
      };

      const calculateStudentScore = (studentId) => {
        if (rubricType === "holistic") {
          const levelIndex = parseInt(studentScores[studentId]?.level) || 0;
          return (levelIndex / (maxScore - 1)) * 100;
        } else {
          let totalScore = 0;
          criteria.forEach((criterion, index) => {
            const score = studentScores[studentId]?.[index] || 0;
            totalScore += (score / maxScore) * (criterion.weight / 100) * 100;
          });
          return totalScore;
        }
      };

      const checkOutcomeAchievement = (studentId, outcomeId) => {
        const outcome = outcomes.find((o) => o.id === outcomeId);
        if (!outcome || !outcome.relatedCriteria.length) return false;

        if (rubricType === "holistic") {
          const levelIndex = parseInt(studentScores[studentId]?.level) || 0;
          const scorePercentage = (levelIndex / (maxScore - 1)) * 100;
          return scorePercentage >= passingThreshold;
        } else {
          const relatedCriteria = outcome.relatedCriteria;
          return relatedCriteria.every((criterionIndex) => {
            const score = studentScores[studentId]?.[criterionIndex] || 0;
            const scorePercentage = (score / maxScore) * 100;
            return scorePercentage >= passingThreshold;
          });
        }
      };

      const exportToWord = () => {
        let htmlContent = `
          <h1>${rubricTitle}</h1>
          <h2>Loại Rubric: ${rubricType === "analytic" ? "Định lượng" : "Định tính"}</h2>
          <h3>Tiêu chí đánh giá</h3>
          <table border="1">
            <thead>
              <tr>
                <th>Tiêu chí</th>
                ${rubricType === "analytic" ? "<th>Trọng số (%)</th>" : ""}
                ${levels.map((level) => `<th>${level}</th>`).join("")}
              </tr>
            </thead>
            <tbody>
              ${criteria
                .map(
                  (criterion) => `
                    <tr>
                      <td>${criterion.name}</td>
                      ${rubricType === "analytic" ? `<td>${criterion.weight}</td>` : ""}
                      ${criterion.descriptions.map((desc) => `<td>${desc}</td>`).join("")}
                    </tr>
                  `
                )
                .join("")}
            </tbody>
          </table>
          <h3>Chuẩn đầu ra</h3>
          <table border="1">
            <thead>
              <tr>
                <th>Mã CĐR</th>
                <th>Mô tả</th>
                <th>Tiêu chí liên quan</th>
              </tr>
            </thead>
            <tbody>
              ${outcomes
                .map(
                  (outcome) => `
                    <tr>
                      <td>${outcome.code}</td>
                      <td>${outcome.description}</td>
                      <td>${outcome.relatedCriteria
                        .map((idx) => criteria[idx]?.name)
                        .join(", ")}</td>
                    </tr>
                  `
                )
                .join("")}
            </tbody>
          </table>
          <h3>Kết quả đo lường</h3>
          <table border="1">
            <thead>
              <tr>
                <th>Họ Tên</th>
                <th>Mã số SV</th>
                ${rubricType === "holistic"
                  ? "<th>Mức chất lượng</th>"
                  : criteria.map((c) => `<th>${c.name}</th>`).join("")}
                <th>Tổng điểm</th>
                ${outcomes.map((o) => `<th>${o.code}</th>`).join("")}
              </tr>
            </thead>
            <tbody>
              ${students
                .map(
                  (student) => `
                    <tr>
                      <td>${student.fullName}</td>
                      <td>${student.studentId}</td>
                      ${rubricType === "holistic"
                        ? `<td>${levels[studentScores[student.id]?.level] || ""}</td>`
                        : criteria
                            .map(
                              (_, index) =>
                                `<td>${studentScores[student.id]?.[index] || ""}</td>`
                            )
                            .join("")}
                      <td>${calculateStudentScore(student.id).toFixed(2)}</td>
                      ${outcomes
                        .map(
                          (outcome) =>
                            `<td>${
                              checkOutcomeAchievement(student.id, outcome.id)
                                ? "Đạt"
                                : "Không đạt"
                            }</td>`
                        )
                        .join("")}
                    </tr>
                  `
                )
                .join("")}
            </tbody>
          </table>
        `;

        const converted = htmlDocx.asBlob(htmlContent);
        saveAs(converted, `${rubricTitle || "Rubric"}.docx`);
      };

      const RubricDesignTab = () => (
        <div>
          <div className="mb-4">
            <label className="block mb-2 font-bold">Loại Rubric:</label>
            <select
              value={rubricType}
              onChange={(e) => {
                setRubricType(e.target.value);
                localStorage.setItem("rubricType", e.target.value);
                setCriteria([]);
                setLevels([]);
                setMaxScore(4);
                localStorage.setItem("criteria", JSON.stringify([]));
                localStorage.setItem("levels", JSON.stringify([]));
                localStorage.setItem("maxScore", JSON.stringify(4));
              }}
              className="w-full border rounded-md p-2"
            >
              <option value="analytic">Định lượng</option>
              <option value="holistic">Định tính</option>
            </select>
          </div>
          <div className="mb-4">
            <label className="block mb-2 font-bold">Tiêu đề Rubric:</label>
            <input
              type="text"
              value={rubricTitle}
              onChange={(e) => {
                setRubricTitle(e.target.value);
                localStorage.setItem("rubricTitle", e.target.value);
              }}
              className="w-full border rounded-md p-2"
            />
          </div>
          <div className="mb-4">
            <button
              onClick={() => setShowRubricTemplates(true)}
              className="bg-blue-500 text-white px-4 py-2 rounded-md"
            >
              Chọn mẫu Rubric
            </button>
          </div>
          {showRubricTemplates && (
            <div className="mb-4">
              <h3 className="font-bold mb-2">Danh sách mẫu Rubric</h3>
              <div className="grid grid-cols-3 gap-4">
                {Object.keys(rubricTemplates).map((key) => (
                  <button
                    key={key}
                    onClick={() => loadRubricTemplate(key)}
                    className="bg-green-500 text-white px-4 py-2 rounded-md"
                  >
                    {rubricTemplates[key].title}
                  </button>
                ))}
              </div>
              <button
                onClick={() => setShowRubricTemplates(false)}
                className="mt-4 bg-red-500 text-white px-4 py-2 rounded-md"
              >
                Đóng
              </button>
            </div>
          )}
          <div className="mb-4">
            <h3 className="font-bold mb-2">Mức đánh giá</h3>
            <div className="flex gap-2 mb-2">
              {levels.map((level, index) => (
                <div key={index} className="flex items-center gap-2">
                  <input
                    type="text"
                    value={level}
                    onChange={(e) => updateLevel(index, e.target.value)}
                    className="border rounded-md p-2 w-32"
                  />
                  <button
                    onClick={() => removeLevel(index)}
                    className="text-red-500"
                  >
                    Xóa
                  </button>
                </div>
              ))}
              <button
                onClick={addLevel}
                className="bg-blue-500 text-white px-4 py-2 rounded-md"
              >
                Thêm mức
              </button>
            </div>
          </div>
          <div className="mb-4">
            <h3 className="font-bold mb-2">Tiêu chí</h3>
            {criteria.map((criterion, index) => (
              <div key={index} className="mb-4 p-4 border rounded-md">
                <div className="flex gap-2 mb-2">
                  <input
                    type="text"
                    value={criterion.name}
                    onChange={(e) => updateCriterion(index, "name", e.target.value)}
                    placeholder="Tên tiêu chí"
                    className="border rounded-md p-2 flex-1"
                  />
                  {rubricType === "analytic" && (
                    <input
                      type="number"
                      value={criterion.weight}
                      onChange={(e) =>
                        updateCriterion(index, "weight", parseFloat(e.target.value))
                      }
                      placeholder="Trọng số (%)"
                      className="border rounded-md p-2 w-24"
                    />
                  )}
                  <button
                    onClick={() => removeCriterion(index)}
                    className="text-red-500"
                  >
                    Xóa
                  </button>
                </div>
                <div>
                  <h4 className="font-bold mb-2">Mô tả cho từng mức</h4>
                  {levels.map((level, levelIndex) => (
                    <div key={levelIndex} className="mb-2">
                      <label className="block mb-1">{level}</label>
                      <textarea
                        value={criterion.descriptions[levelIndex] || ""}
                        onChange={(e) =>
                          updateCriterionDescription(index, levelIndex, e.target.value)
                        }
                        className="w-full border rounded-md p-2"
                        rows="2"
                      />
                    </div>
                  ))}
                </div>
              </div>
            ))}
            <button
              onClick={addCriterion}
              className="bg-blue-500 text-white px-4 py-2 rounded-md"
            >
              Thêm tiêu chí
            </button>
          </div>
          <div className="mb-4">
            <h3 className="font-bold mb-2">Chuẩn đầu ra (CĐR)</h3>
            <button
              onClick={() => setShowOutcomeForm(true)}
              className="bg-blue-500 text-white px-4 py-2 rounded-md mb-2"
            >
              Thêm CĐR
            </button>
            {showOutcomeForm && (
              <div className="p-4 border rounded-md mb-4">
                <div className="mb-2">
                  <label className="block mb-1">Mã CĐR</label>
                  <input
                    type="text"
                    value={newOutcome.code}
                    onChange={(e) => setNewOutcome({ ...newOutcome, code: e.target.value })}
                    className="w-full border rounded-md p-2"
                  />
                </div>
                <div className="mb-2">
                  <label className="block mb-1">Mô tả</label>
                  <textarea
                    value={newOutcome.description}
                    onChange={(e) =>
                      setNewOutcome({ ...newOutcome, description: e.target.value })
                    }
                    className="w-full border rounded-md p-2"
                    rows="3"
                  />
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={addOutcome}
                    className="bg-green-500 text-white px-4 py-2 rounded-md"
                  >
                    Lưu
                  </button>
                  <button
                    onClick={() => setShowOutcomeForm(false)}
                    className="bg-red-500 text-white px-4 py-2 rounded-md"
                  >
                    Hủy
                  </button>
                </div>
              </div>
            )}
            <table className="w-full border">
              <thead>
                <tr>
                  <th className="border p-2">Mã CĐR</th>
                  <th className="border p-2">Mô tả</th>
                  <th className="border p-2">Tiêu chí liên quan</th>
                  <th className="border p-2">Hành động</th>
                </tr>
              </thead>
              <tbody>
                {outcomes.map((outcome) => (
                  <tr key={outcome.id}>
                    <td className="border p-2">
                      <input
                        type="text"
                        value={outcome.code}
                        onChange={(e) => updateOutcome(outcome.id, "code", e.target.value)}
                        className="w-full border rounded-md p-1"
                      />
                    </td>
                    <td className="border p-2">
                      <textarea
                        value={outcome.description}
                        onChange={(e) =>
                          updateOutcome(outcome.id, "description", e.target.value)
                        }
                        className="w-full border rounded-md p-1"
                        rows="2"
                      />
                    </td>
                    <td className="border p-2">
                      {criteria.map((criterion, index) => (
                        <div key={index} className="flex items-center gap-2">
                          <input
                            type="checkbox"
                            checked={criterion.relatedOutcomes?.includes(outcome.id)}
                            onChange={(e) =>
                              updateCriterionOutcomes(index, outcome.id, e.target.checked)
                            }
                          />
                          <span>{criterion.name}</span>
                        </div>
                      ))}
                    </td>
                    <td className="border p-2 text-center">
                      <button
                        onClick={() => removeOutcome(outcome.id)}
                        className="text-red-500"
                      >
                        Xóa
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );

      const MeasurementTab = () => (
        <div>
          <div className="mb-4">
            <label className="block mb-2 font-bold">Ngưỡng đạt (%):</label>
            <input
              type="number"
              value={passingThreshold}
              onChange={(e) => {
                setPassingThreshold(parseFloat(e.target.value));
                localStorage.setItem("passingThreshold", JSON.stringify(parseFloat(e.target.value)));
              }}
              className="w-24 border rounded-md p-2"
            />
          </div>
          <div className="mb-4">
            <button
              onClick={() => setShowStudentForm(true)}
              className="bg-blue-500 text-white px-4 py-2 rounded-md"
            >
              Thêm sinh viên
            </button>
          </div>
          {showStudentForm && (
            <div className="p-4 border rounded-md mb-4">
              <div className="mb-2">
                <label className="block mb-1">Họ Tên</label>
                <input
                  type="text"
                  value={newStudent.fullName}
                  onChange={(e) =>
                    setNewStudent({ ...newStudent, fullName: e.target.value })
                  }
                  className="w-full border rounded-md p-2"
                />
              </div>
              <div className="mb-2">
                <label className="block mb-1">Mã số sinh viên</label>
                <input
                  type="text"
                  value={newStudent.studentId}
                  onChange={(e) =>
                    setNewStudent({ ...newStudent, studentId: e.target.value })
                  }
                  className="w-full border rounded-md p-2"
                />
              </div>
              <div className="flex gap-2">
                <button
                  onClick={addStudent}
                  className="bg-green-500 text-white px-4 py-2 rounded-md"
                >
                  Lưu
                </button>
                <button
                  onClick={() => setShowStudentForm(false)}
                  className="bg-red-500 text-white px-4 py-2 rounded-md"
                >
                  Hủy
                </button>
              </div>
            </div>
          )}
          <div className="mb-4">
            <h3 className="font-bold mb-2">Nhập điểm</h3>
            <table className="w-full border">
              <thead>
                <tr>
                  <th className="border p-2">Họ Tên Sinh Viên</th>
                  <th className="border p-2">Mã số sinh viên</th>
                  {rubricType === "holistic" ? (
                    <th className="border p-2">Mức chất lượng</th>
                  ) : (
                    criteria.map((criterion, index) => (
                      <th key={index} className="border p-2">
                        {criterion.name}
                      </th>
                    ))
                  )}
                  <th className="border p-2">Tổng điểm</th>
                  <th className="border p-2">Hành động</th>
                </tr>
              </thead>
              <tbody>
                {students.map((student) => (
                  <tr key={student.id}>
                    <td className="border p-2">{student.fullName}</td>
                    <td className="border p-2">{student.studentId}</td>
                    {rubricType === "holistic" ? (
                      <td className="border p-2">
                        <select
                          value={studentScores[student.id]?.level || ""}
                          onChange={(e) =>
                            updateStudentScore(student.id, 0, e.target.value)
                          }
                          className="w-full border rounded-md p-1"
                        >
                          <option value="">Chọn mức...</option>
                          {levels.map((level, index) => (
                            <option key={index} value={index}>
                              {level}
                            </option>
                          ))}
                        </select>
                      </td>
                    ) : (
                      criteria.map((_, index) => (
                        <td key={index} className="border p-2">
                          <input
                            type="number"
                            value={studentScores[student.id]?.[index] || ""}
                            onChange={(e) =>
                              updateStudentScore(student.id, index, e.target.value)
                            }
                            className="w-full text-center border rounded-md p-1"
                            min="0"
                            max={maxScore}
                          />
                        </td>
                      ))
                    )}
                    <td className="border p-2 text-center">
                      {calculateStudentScore(student.id).toFixed(2)}
                    </td>
                    <td className="border p-2 text-center">
                      <button
                        onClick={() => removeStudent(student.id)}
                        className="text-red-500 text-sm"
                      >
                        Xóa
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="mb-4">
            <h3 className="font-bold mb-2">Kết quả đo lường CĐR</h3>
            <table className="w-full border">
              <thead>
                <tr>
                  <th className="border p-2">Họ Tên</th>
                  <th className="border p-2">Mã số SV</th>
                  {outcomes.map((outcome) => (
                    <th key={outcome.id} className="border p-2">
                      {outcome.code}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {students.map((student) => (
                  <tr key={student.id}>
                    <td className="border p-2">{student.fullName}</td>
                    <td className="border p-2">{student.studentId}</td>
                    {outcomes.map((outcome) => (
                      <td key={outcome.id} className="border p-2 text-center">
                        {checkOutcomeAchievement(student.id, outcome.id)
                          ? "Đạt"
                          : "Không đạt"}
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <button
            onClick={exportToWord}
            className="bg-green-500 text-white px-4 py-2 rounded-md"
          >
            Xuất file Word
          </button>
        </div>
      );

      return (
        <div className="bg-white p-6 rounded-lg shadow-lg">
          <h1 className="text-2xl font-bold mb-6">
            Công cụ Tạo Rubric và Đo Lường Chuẩn Đầu Ra - HCM USSH
          </h1>
          <div className="mb-4">
            <button
              onClick={() => setActiveTab("design")}
              className={`px-4 py-2 rounded-md ${
                activeTab === "design" ? "bg-blue-500 text-white" : "bg-gray-200"
              }`}
            >
              Thiết kế Rubric
            </button>
            <button
              onClick={() => setActiveTab("measurement")}
              className={`ml-2 px-4 py-2 rounded-md ${
                activeTab === "measurement" ? "bg-blue-500 text-white" : "bg-gray-200"
              }`}
            >
              Đo lường Chuẩn Đầu Ra
            </button>
          </div>
          {activeTab === "design" ? <RubricDesignTab /> : <MeasurementTab />}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
