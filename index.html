          "Nghiên cứu sâu, phân tích logic, kết luận thuyết phục",
          "Nghiên cứu khá, phân tích rõ ràng, kết luận hợp lý",
          "Nghiên cứu cơ bản, phân tích đơn giản",
          "Nghiên cứu yếu, phân tích thiếu rõ ràng",
        ],
      },
      integrativeLearning: {
        name: "Học tập tích hợp",
        descriptions: [
          "Kết nối ý tưởng xuất sắc, ứng dụng sáng tạo",
          "Kết nối ý tưởng tốt, ứng dụng khá",
          "Kết nối ý tưởng cơ bản, ứng dụng hạn chế",

        ],
      },
      interculturalKnowledge: {
        name: "Hiểu biết và Năng lực Liên văn hóa",
        descriptions: [
          "Hiểu sâu sắc văn hóa, tương tác xuất sắc",
          "Hiểu khá, tương tác tốt",
          "Hiểu cơ bản, tương tác hạn chế",
          "Hiểu yếu, thiếu tương tác",
        ],
      },
      oralCommunication: {
        name: "Giao tiếp bằng lời nói",
        descriptions: [
          "Trình bày tự tin, rõ ràng, thu hút khán giả",
          "Trình bày ổn, nội dung khá, khán giả quan tâm",
          "Trình bày cơ bản, thiếu tương tác",
          "Trình bày yếu, không thu hút",
        ],
      },
      problemSolving: {
        name: "Giải quyết vấn đề",
        descriptions: [
          "Xác định và giải quyết vấn đề một cách sáng tạo",
          "Xác định và giải quyết vấn đề khá",
          "Xác định và giải quyết vấn đề cơ bản",
          "Không xác định hoặc giải quyết được vấn đề",
        ],
      },
      quantitativeLiteracy: {
        name: "Hiểu biết định lượng",
        descriptions: [
          "Hiểu và ứng dụng dữ liệu số một cách hiệu quả",
          "Hiểu và ứng dụng dữ liệu số khá",
          "Hiểu và ứng dụng dữ liệu số cơ bản",
          "Không hiểu hoặc ứng dụng được dữ liệu số",
        ],
      },
      reading: {
        name: "Kỹ năng đọc",
        descriptions: [
          "Hiểu và phân tích văn bản một cách sâu sắc",
          "Hiểu và phân tích văn bản khá",
          "Hiểu và phân tích văn bản cơ bản",
          "Không hiểu hoặc phân tích được văn bản",
        ],
      },
      teamwork: {
        name: "Làm việc nhóm",
        descriptions: [
          "Hợp tác xuất sắc, đóng góp tích cực",
          "Hợp tác khá, có đóng góp",
          "Hợp tác cơ bản, đóng góp hạn chế",
          "Thiếu hợp tác, không đóng góp",
        ],
      },
      writtenCommunication: {
        name: "Giao tiếp bằng văn bản",
        descriptions: [
          "Ngôn ngữ chính xác, cấu trúc rõ ràng, ý tưởng sáng tạo",
          "Ngôn ngữ đúng, cấu trúc ổn, ý tưởng khá",
          "Ngôn ngữ có lỗi nhỏ, cấu trúc cơ bản",
          "Ngôn ngữ nhiều lỗi, cấu trúc yếu",
        ],
      },
    };

    const App = () => {
      // State để quản lý rubric
      const [rubricType, setRubricType] = useState("analytic");
      const [rubricTitle, setRubricTitle] = useState("Rubric Đánh Giá");
      const [criteria, setCriteria] = useState(rubricTemplates.analytic.criteria);
      const [levels, setLevels] = useState(rubricTemplates.analytic.levels);
      const [assignmentType, setAssignmentType] = useState("essay");
      const [framework, setFramework] = useState("none");
      const [savedRubrics, setSavedRubrics] = useState([]);
      const [criterionScores, setCriterionScores] = useState([]);
      const [levelScores, setLevelScores] = useState([]);

      // State cho chuẩn đầu ra
      const [outcomes, setOutcomes] = useState([{ id: Date.now(), name: "CĐR 1", relatedCriteria: [] }]);
      const [newOutcomeName, setNewOutcomeName] = useState("");

      // State cho đo lường chuẩn đầu ra
      const [students, setStudents] = useState([]);
      const [studentFullName, setStudentFullName] = useState("");
      const [studentId, setStudentId] = useState("");
      const [studentScores, setStudentScores] = useState({});
      const [maxScore, setMaxScore] = useState(10);

      // State cho tab
      const [activeTab, setActiveTab] = useState("design");

      // Load saved data from LocalStorage
      useEffect(() => {
        const storedRubrics = JSON.parse(localStorage.getItem("savedRubrics")) || [];
        setSavedRubrics(storedRubrics);
        const storedStudents = JSON.parse(localStorage.getItem("students")) || [];
        setStudents(storedStudents);
        const storedStudentScores = JSON.parse(localStorage.getItem("studentScores")) || {};
        setStudentScores(storedStudentScores);
        const storedOutcomes = JSON.parse(localStorage.getItem("outcomes")) || [{ id: Date.now(), name: "CĐR 1", relatedCriteria: [] }];
        setOutcomes(storedOutcomes);
      }, []);

      // Cập nhật điểm khi criteria hoặc levels thay đổi
      useEffect(() => {
        if (rubricType === "holistic") {
          setLevelScores(levels.map(() => ""));
        } else {
          setCriterionScores(criteria.map(() => ""));
        }
      }, [criteria, levels, rubricType]);

      // Quản lý Chuẩn Đầu Ra
      const addOutcome = () => {
        if (!newOutcomeName.trim()) {
          alert("Vui lòng nhập tên Chuẩn Đầu Ra!");
          return;
        }
        const newOutcome = { id: Date.now(), name: newOutcomeName, relatedCriteria: [] };
        const updatedOutcomes = [...outcomes, newOutcome];
        setOutcomes(updatedOutcomes);
        localStorage.setItem("outcomes", JSON.stringify(updatedOutcomes));
        setNewOutcomeName("");
      };

      const updateOutcome = (id, name) => {
        const updatedOutcomes = outcomes.map((outcome) =>
          outcome.id === id ? { ...outcome, name } : outcome
        );
        setOutcomes(updatedOutcomes);
        localStorage.setItem("outcomes", JSON.stringify(updatedOutcomes));
      };

      const removeOutcome = (id) => {
        const updatedOutcomes = outcomes.filter((outcome) => outcome.id !== id);
        setOutcomes(updatedOutcomes);
        localStorage.setItem("outcomes", JSON.stringify(updatedOutcomes));
        // Xóa liên kết tiêu chí với CĐR đã xóa
        const newCriteria = criteria.map((criterion) => ({
          ...criterion,
          relatedOutcomes: (criterion.relatedOutcomes || []).filter((outcomeId) => outcomeId !== id),
        }));
        setCriteria(newCriteria);
      };

      const updateCriterionOutcomes = (criterionIndex, outcomeId, isChecked) => {
        const newCriteria = [...criteria];
        if (!newCriteria[criterionIndex].relatedOutcomes) {
          newCriteria[criterionIndex].relatedOutcomes = [];
        }
        if (isChecked) {
          newCriteria[criterionIndex].relatedOutcomes = [
            ...newCriteria[criterionIndex].relatedOutcomes,
            outcomeId,
          ];
        } else {
          newCriteria[criterionIndex].relatedOutcomes = newCriteria[criterionIndex].relatedOutcomes.filter(
            (id) => id !== outcomeId
          );
        }
        setCriteria(newCriteria);

        // Cập nhật outcomes
        const newOutcomes = outcomes.map((outcome) => {
          if (outcome.id === outcomeId) {
            if (isChecked) {
              return { ...outcome, relatedCriteria: [...outcome.relatedCriteria, criterionIndex] };
            } else {
              return {
                ...outcome,
                relatedCriteria: outcome.relatedCriteria.filter((idx) => idx !== criterionIndex),
              };
            }
          }
          return outcome;
        });
        setOutcomes(newOutcomes);
        localStorage.setItem("outcomes", JSON.stringify(newOutcomes));
      };

      // Save rubric to LocalStorage
      const saveRubric = () => {
        const newRubric = {
          title: rubricTitle,
          type: rubricType,
          criteria,
          levels,
          outcomes,
          criterionScores: rubricType === "analytic" ? criterionScores : undefined,
          levelScores: rubricType === "holistic" ? levelScores : undefined,
        };
        const updatedRubrics = [...savedRubrics, newRubric];
        setSavedRubrics(updatedRubrics);
        localStorage.setItem("savedRubrics", JSON.stringify(updatedRubrics));
        alert("Rubric đã được lưu!");
      };

      // Load a saved rubric
      const loadSavedRubric = (rubric) => {
        setRubricTitle(rubric.title);
        setRubricType(rubric.type);
        let loadedCriteria = rubric.criteria.map((criterion) => ({
          ...criterion,
          threshold: criterion.threshold || 60,
          relatedOutcomes: criterion.relatedOutcomes || [],
        }));
        if (rubric.type === "holistic") {
          loadedCriteria = loadedCriteria.map((criterion) => ({
            ...criterion,
            scores: criterion.scores || levels.map((_, i) => levels.length - i - 1),
          }));
        }
        setCriteria(loadedCriteria);
        setLevels(rubric.levels);
        setOutcomes(rubric.outcomes || [{ id: Date.now(), name: "CĐR 1", relatedCriteria: [] }]);
        if (rubric.type === "analytic" && rubric.criterionScores) {
          setCriterionScores(rubric.criterionScores);
        } else if (rubric.type === "holistic" && rubric.levelScores) {
          setLevelScores(rubric.levelScores);
        }
      };

      // Tải mẫu rubric
      const loadTemplate = (type) => {
        setRubricType(type);
        setRubricTitle(rubricTemplates[type].name);
        let templateCriteria = rubricTemplates[type].criteria;
        if (type !== "holistic" && rubricType === "holistic") {
          templateCriteria = templateCriteria.map((criterion) => {
            const { scores, ...rest } = criterion;
            return { ...rest, relatedOutcomes: [] };
          });
        } else if (type === "holistic") {
          templateCriteria = templateCriteria.map((criterion) => ({
            ...criterion,
            relatedOutcomes: [],
            scores: criterion.scores || rubricTemplates[type].levels.map((_, i) => rubricTemplates[type].levels.length - i - 1),
          }));
        } else {
          templateCriteria = templateCriteria.map((criterion) => ({
            ...criterion,
            relatedOutcomes: [],
          }));
        }
        setCriteria(templateCriteria);
        setLevels(rubricTemplates[type].levels);
        setOutcomes([{ id: Date.now(), name: "CĐR 1", relatedCriteria: [] }]);
      };

      // Thêm tiêu chí từ gợi ý
      const addSuggestedCriterion = (criterionName, descriptions = levels.map(() => ""), weight = 0) => {
        const newCriterion = rubricType === "holistic"
          ? {
              name: criterionName,
              weight: 100,
              threshold: 60,
              relatedOutcomes: [],
              descriptions,
              scores: levels.map((_, i) => levels.length - i - 1),
            }
          : { name: criterionName, weight, threshold: 60, relatedOutcomes: [], descriptions };
        setCriteria([...criteria, newCriterion]);
      };

      // Thêm tiêu chí từ Bloom’s Taxonomy
      const addBloomsCriterion = (key) => {
        addSuggestedCriterion(bloomsTaxonomy[key].name, bloomsTaxonomy[key].descriptions);
      };

      // Thêm tiêu chí từ AAC&U
      const addAacuCriterion = (key) => {
        addSuggestedCriterion(aacuValueRubrics[key].name, aacuValueRubrics[key].descriptions);
      };

      // Thêm tiêu chí mới
      const addCriterion = () => {
        const newCriterion = rubricType === "holistic"
          ? {
              name: `Tiêu chí ${criteria.length + 1}`,
              weight: 100,
              threshold: 60,
              relatedOutcomes: [],
              descriptions: levels.map(() => ""),
              scores: levels.map((_, i) => levels.length - i - 1),
            }
          : {
              name: `Tiêu chí ${criteria.length + 1}`,
              weight: 0,
              threshold: 60,
              relatedOutcomes: [],
              descriptions: levels.map(() => ""),
            };
        setCriteria([...criteria, newCriterion]);
      };

      // Thêm mức độ mới
      const addLevel = () => {
        const newLevel = `Mức ${levels.length + 1}`;
        setLevels([...levels, newLevel]);
        setCriteria(
          criteria.map((criterion) => ({
            ...criterion,
            descriptions: [...criterion.descriptions, ""],
            scores: rubricType === "holistic" ? [...(criterion.scores || []), levels.length] : criterion.scores,
          }))
        );
      };

      // Cập nhật tiêu chí
      const updateCriterion = (index, field, value) => {
        const newCriteria = [...criteria];
        if (field === "weight" || field === "threshold") {
          newCriteria[index][field] = parseFloat(value) || 0;
        } else {
          newCriteria[index][field] = value;
        }
        setCriteria(newCriteria);
      };

      // Cập nhật mô tả
      const updateDescription = (criterionIndex, levelIndex, value) => {
        const newCriteria = [...criteria];
        newCriteria[criterionIndex].descriptions[levelIndex] = value;
        setCriteria(newCriteria);
      };

      // Cập nhật thang điểm (định tính)
      const updateScore = (criterionIndex, levelIndex, value) => {
        const newCriteria = [...criteria];
        if (!newCriteria[criterionIndex].scores) {
          newCriteria[criterionIndex].scores = levels.map((_, i) => levels.length - i - 1);
        }
        newCriteria[criterionIndex].scores[levelIndex] = parseFloat(value) || 0;
        setCriteria(newCriteria);
      };

      // Xóa tiêu chí
      const removeCriterion = (index) => {
        setCriteria(criteria.filter((_, i) => i !== index));
        if (rubricType === "analytic") {
          setCriterionScores(criterionScores.filter((_, i) => i !== index));
        }
        // Cập nhật outcomes
        const newOutcomes = outcomes.map((outcome) => ({
          ...outcome,
          relatedCriteria: outcome.relatedCriteria
            .filter((idx) => idx !== index)
            .map((idx) => (idx > index ? idx - 1 : idx)),
        }));
        setOutcomes(newOutcomes);
        localStorage.setItem("outcomes", JSON.stringify(newOutcomes));
      };

      // Xóa mức độ
      const removeLevel = (index) => {
        setLevels(levels.filter((_, i) => i !== index));
        setCriteria(
          criteria.map((criterion) => ({
            ...criterion,
            descriptions: criterion.descriptions.filter((_, i) => i !== index),
            scores: criterion.scores ? criterion.scores.filter((_, i) => i !== index) : criterion.scores,
          }))
        );
        if (rubricType === "holistic") {
          setLevelScores(levelScores.filter((_, i) => i !== index));
        }
      };

      // Xóa tất cả
      const clearAll = () => {
        setRubricTitle("Rubric Đánh Giá");
        setRubricType("analytic");
        setCriteria([]);
        setLevels([]);
        setCriterionScores([]);
        setLevelScores([]);
        setStudents([]);
        setStudentScores({});
        setOutcomes([{ id: Date.now(), name: "CĐR 1", relatedCriteria: [] }]);
        localStorage.removeItem("students");
        localStorage.removeItem("studentScores");
        localStorage.removeItem("outcomes");
      };

      // Quản lý sinh viên
      const addStudent = () => {
        if (!studentFullName.trim() || !studentId.trim()) {
          alert("Vui lòng nhập đầy đủ Họ Tên Sinh Viên và Mã số sinh viên!");
          return;
        }
        const newStudent = { id: Date.now(), fullName: studentFullName, studentId };
        const updatedStudents = [...students, newStudent];
        setStudents(updatedStudents);
        setStudentScores({
          ...studentScores,
          [newStudent.id]: rubricType === "holistic" ? { level: "" } : criteria.map(() => ""),
        });
        localStorage.setItem("students", JSON.stringify(updatedStudents));
        localStorage.setItem("studentScores", JSON.stringify({
          ...studentScores,
          [newStudent.id]: rubricType === "holistic" ? { level: "" } : criteria.map(() => ""),
        }));
        setStudentFullName("");
        setStudentId("");
      };

      const removeStudent = (id) => {
        const updatedStudents = students.filter((student) => student.id !== id);
        const updatedScores = { ...studentScores };
        delete updatedScores[id];
        setStudents(updatedStudents);
        setStudentScores(updatedScores);
        localStorage.setItem("students", JSON.stringify(updatedStudents));
        localStorage.setItem("studentScores", JSON.stringify(updatedScores));
      };

      const updateStudentScore = (studentId, criterionIndex, value) => {
        const updatedScores = { ...studentScores };
        if (rubricType === "holistic") {
          updatedScores[studentId] = { level: value };
        } else {
          updatedScores[studentId][criterionIndex] = value;
        }
        setStudentScores(updatedScores);
        localStorage.setItem("studentScores", JSON.stringify(updatedScores));
      };

      // Tính điểm tổng và kiểm tra đạt ngưỡng
      const calculateStudentScore = (studentId) => {
        if (rubricType === "holistic") {
          const levelIndex = studentScores[studentId]?.level;
          if (levelIndex === "" || levelIndex === undefined) return 0;
          return criteria[0].scores[levelIndex] || 0;
        } else {
          return criteria.reduce((sum, criterion, index) => {
            const score = parseFloat(studentScores[studentId]?.[index]) || 0;
            return sum + (score * criterion.weight) / 100;
          }, 0);
        }
      };

      const maxPossibleScore = rubricType === "holistic"
        ? Math.max(...(criteria[0]?.scores || [10]))
        : maxScore;

      const isCriterionPassing = (studentId, criterion, index) => {
        if (rubricType === "holistic") {
          const levelIndex = studentScores[studentId]?.level;
          if (levelIndex === "" || levelIndex === undefined) return false;
          const score = criteria[0].scores[levelIndex] || 0;
          return score >= (criterion.threshold / 100) * maxPossibleScore;
        } else {
          const score = parseFloat(studentScores[studentId]?.[index]) || 0;
          return score >= (criterion.threshold / 100) * maxScore;
        }
      };

      const isStudentPassingOutcome = (studentId, outcome) => {
        if (outcome.relatedCriteria.length === 0) return false;
        return outcome.relatedCriteria.every((criterionIndex) =>
          isCriterionPassing(studentId, criteria[criterionIndex], criterionIndex)
        );
      };

      const getOutcomeAchievementRate = (outcome) => {
        if (students.length === 0) return 0;
        return (
          (students.filter((student) => isStudentPassingOutcome(student.id, outcome)).length /
            students.length) *
          100
        ).toFixed(2);
      };

      // Kiểm tra tổng trọng số (cho định lượng)
      const totalWeight = criteria.reduce((sum, criterion) => sum + (criterion.weight || 0), 0);
      const isWeightValid = rubricType === "analytic" ? totalWeight === 100 : true;

      // Xuất Word
      const exportToWord = () => {
        if (rubricType === "analytic" && !isWeightValid) {
          alert("Tổng trọng số phải bằng 100%!");
          return;
        }

        try {
          let htmlContent;
          if (rubricType === "analytic") {
            htmlContent = `
              <html>
                <head>
                  <meta charset="UTF-8">
                  <style>
                    body { font-family: Arial, sans-serif; }
                    h1 { font-size: 24px; font-weight: bold; }
                    h2 { font-size: 20px; font-weight: bold; }
                    h3 { font-size: 18px; font-weight: bold; }
                    p { font-size: 16px; }
                    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
                    th, td { border: 1px solid black; padding: 8px; text-align: left; }
                    th { background-color: #f2f2f2; }
                    .total-row { font-weight: bold; }
                  </style>
                </head>
                <body>
                  <h1>${rubricTitle}</h1>
                  <p>Loại Rubric: Định lượng</p>
                  <p>Khung đánh giá: ${framework === 'blooms' ? 'Bloom’s Taxonomy' : framework === 'aacu' ? 'AAC&U VALUE Rubrics' : 'Không'}</p>
                  <h2>Bảng Rubric</h2>
                  <table>
                    <thead>
                      <tr>
                        <th>Tiêu chí</th>
                        <th>Trọng số (%)</th>
                        <th>Ngưỡng đạt (%)</th>
                        <th>Liên quan đến CĐR</th>
                        ${levels.map((level) => `<th>${level}</th>`).join('')}
                      </tr>
                    </thead>
                    <tbody>
                      ${criteria.map((criterion) => `
                        <tr>
                          <td>${criterion.name}</td>
                          <td>${criterion.weight}</td>
                          <td>${criterion.threshold}</td>
                          <td>${
                            (criterion.relatedOutcomes || [])
                              .map((id) => outcomes.find((o) => o.id === id)?.name)
                              .filter((name) => name)
                              .join(", ") || "-"
                          }</td>
                          ${criterion.descriptions.map((desc) => `<td>${desc || "-"}</td>`).join('')}
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                  <h2>Danh sách Chuẩn Đầu Ra</h2>
                  ${outcomes
                    .map(
                      (outcome) => `
                    <h3>${outcome.name}</h3>
                    <p>Tiêu chí liên quan: ${
                      outcome.relatedCriteria
                        .map((idx) => criteria[idx]?.name)
                        .filter((name) => name)
                        .join(", ") || "Không có"
                    }</p>
                  `
                    )
                    .join('')}
                  <h2>Điểm Sinh Viên</h2>
                  <table>
                    <thead>
                      <tr>
                        <th>Họ Tên Sinh Viên</th>
                        <th>Mã số sinh viên</th>
                        ${criteria.map((criterion) => `<th>${criterion.name}</th>`).join('')}
                        <th>Tổng điểm</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${students
                        .map(
                          (student) => `
                        <tr>
                          <td>${student.fullName}</td>
                          <td>${student.studentId}</td>
                          ${criteria
                            .map(
                              (_, index) => `
                            <td>${studentScores[student.id]?.[index] || ""}</td>
                          `
                            )
                            .join('')}
                          <td>${calculateStudentScore(student.id).toFixed(2)}</td>
                        </tr>
                      `
                        )
                        .join('')}
                    </tbody>
                  </table>
                  <h2>Kết quả Chuẩn Đầu Ra</h2>
                  ${outcomes
                    .map(
                      (outcome) => `
                    <h3>${outcome.name}</h3>
                    <table>
                      <thead>
                        <tr>
                          <th>Họ Tên Sinh Viên</th>
                          <th>Mã số sinh viên</th>
                          <th>Đạt CĐR</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${students
                          .map(
                            (student) => `
                          <tr>
                            <td>${student.fullName}</td>
                            <td>${student.studentId}</td>
                            <td>${isStudentPassingOutcome(student.id, outcome) ? "Đạt" : "Không đạt"}</td>
                          </tr>
                        `
                          )
                          .join('')}
                      </tbody>
                    </table>
                    <p>Tỉ lệ sinh viên đạt ${outcome.name}: ${getOutcomeAchievementRate(outcome)}%</p>
                  `
                    )
                    .join('')}
                  <p>Lưu ý: Tổng điểm = SUM(Điểm x Trọng số / 100). Sinh viên đạt CĐR nếu điểm từng tiêu chí liên quan >= ngưỡng đạt của tiêu chí đó.</p>
                </body>
              </html>
            `;
          } else {
            htmlContent = `
              <html>
                <head>
                  <meta charset="UTF-8">
                  <style>
                    body { font-family: Arial, sans-serif; }
                    h1 { font-size: 24px; font-weight: bold; }
                    h2 { font-size: 20px; font-weight: bold; }
                    h3 { font-size: 18px; font-weight: bold; }
                    p { font-size: 16px; }
                    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
                    th, td { border: 1px solid black; padding: 8px; text-align: left; }
                    th { background-color: #f2f2f2; }
                  </style>
                </head>
                <body>
                  <h1>${rubricTitle}</h1>
                  <p>Loại Rubric: Định tính</p>
                  <p>Khung đánh giá: ${framework === 'blooms' ? 'Bloom’s Taxonomy' : framework === 'aacu' ? 'AAC&U VALUE Rubrics' : 'Không'}</p>
                  ${criteria
                    .map(
                      (criterion, criterionIdx) => `
                    <h2>Tiêu chí: ${criterion.name}</h2>
                    <p>Ngưỡng đạt: ${criterion.threshold}%</p>
                    <p>Liên quan đến CĐR: ${
                      (criterion.relatedOutcomes || [])
                        .map((id) => outcomes.find((o) => o.id === id)?.name)
                        .filter((name) => name)
                        .join(", ") || "-"
                    }</p>
                    <table>
                      <thead>
                        <tr>
                          <th>Mức chất lượng</th>
                          <th>Thang điểm</th>
                          <th>Mô tả mức chất lượng</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${levels
                          .map(
                            (level, levelIdx) => `
                          <tr>
                            <td>${level}</td>
                            <td>${
                              criterion.scores && criterion.scores[levelIdx] !== undefined
                                ? criterion.scores[levelIdx]
                                : levels.length - levelIdx - 1
                            }</td>
                            <td>${criterion.descriptions[levelIdx] || "-"}</td>
                          </tr>
                        `
                          )
                          .join('')}
                      </tbody>
                    </table>
                  `
                    )
                    .join('')}
                  <h2>Danh sách Chuẩn Đầu Ra</h2>
                  ${outcomes
                    .map(
                      (outcome) => `
                    <h3>${outcome.name}</h3>
                    <p>Tiêu chí liên quan: ${
                      outcome.relatedCriteria
                        .map((idx) => criteria[idx]?.name)
                        .filter((name) => name)
                        .join(", ") || "Không có"
                    }</p>
                  `
                    )
                    .join('')}
                  <h2>Điểm Sinh Viên</h2>
                  <table>
                    <thead>
                      <th>Họ Tên Sinh Viên</th>
                      <th>Mã số sinh viên</th>
                      <th>Mức chất lượng</th>
                      <th>Điểm</th>
                    </thead>
                    <tbody>
                      ${students
                        .map(
                          (student) => `
                        <tr>
                          <td>${student.fullName}</td>
                          <td>${student.studentId}</td>
                          <td>${levels[studentScores[student.id]?.level] || ""}</td>
                          <td>${calculateStudentScore(student.id)}</td>
                        </tr>
                      `
                        )
                        .join('')}
                    </tbody>
                  </table>
                  <h2>Kết quả Chuẩn Đầu Ra</h2>
                  ${outcomes
                    .map(
                      (outcome) => `
                    <h3>${outcome.name}</h3>
                    <table>
                      <thead>
                        <tr>
                          <th>Họ Tên Sinh Viên</th>
                          <th>Mã số sinh viên</th>
                          <th>Đạt CĐR</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${students
                          .map(
                            (student) => `
                          <tr>
                            <td>${student.fullName}</td>
                            <td>${student.studentId}</td>
                            <td>${isStudentPassingOutcome(student.id, outcome) ? "Đạt" : "Không đạt"}</td>
                          </tr>
                        `
                          )
                          .join('')}
                      </tbody>
                    </table>
                    <p>Tỉ lệ sinh viên đạt ${outcome.name}: ${getOutcomeAchievementRate(outcome)}%</p>
                  `
                    )
                    .join('')}
                  <p>Lưu ý: Sinh viên đạt CĐR nếu điểm tiêu chí liên quan >= ngưỡng đạt của tiêu chí đó.</p>
                </body>
              </html>
            `;
          }

          const converted = window.htmlDocx.asBlob(htmlContent);
          saveAs(converted, `${rubricTitle}.docx`);
          console.log("Tải file Word thành công!");
        } catch (error) {
          console.error("Lỗi trong hàm exportToWord:", error);
          alert("Đã có lỗi xảy ra khi tạo file Word. Vui lòng kiểm tra console để biết thêm chi tiết.");
        }
      };

      // Giao diện Tab
      const DesignTab = () => (
        <div>
          <h2 className="text-xl font-bold mb-4">Thiết kế Rubric</h2>

          {/* Tiêu đề và loại rubric */}
          <div className="mb-4 grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label className="block text-sm font-medium">Tiêu đề Rubric</label>
              <input
                type="text"
                value={rubricTitle}
                onChange={(e) => setRubricTitle(e.target.value)}
                className="mt-1 block w-full border rounded-md p-2"
              />
            </div>
            <div>
              <label className="block text-sm font-medium">Loại Rubric</label>
              <select
                value={rubricType}
                onChange={(e) => loadTemplate(e.target.value)}
                className="mt-1 block w-full border rounded-md p-2"
              >
                <option value="analytic">Định lượng</option>
                <option value="holistic">Định tính</option>
                <option value="C1">Chuyên cần (C1)</option>
                <option value="C2">Báo cáo nhóm (C2)</option>
                <option value="C3">Tiểu luận cá nhân (C3)</option>
                <option value="C4">Bài tập lớn/Đồ án (C4)</option>
                <option value="C5">Thực hành thí nghiệm (C5)</option>
                <option value="C6">Thi vấn đáp (C6)</option>
                <option value="C7">Kỹ năng thực hành (C7)</option>
                <option value="C8">Thực tập doanh nghiệp (C8)</option>
                <option value="C9">Báo cáo thực tập (C9)</option>
                <option value="C10">Khóa luận (Hội đồng) (C10)</option>
                <option value="C11">Khóa luận (C11)</option>
                <option value="C12">Chuẩn đầu ra học phần (C12)</option>
              </select>
            </div>
            <div>
              <label className="block text-sm font-medium">Khung đánh giá</label>
              <select
                value={framework}
                onChange={(e) => setFramework(e.target.value)}
                className="mt-1 block w-full border rounded-md p-2"
              >
                <option value="none">Không</option>
                <option value="blooms">Bloom’s Taxonomy</option>
                <option value="aacu">AAC&U VALUE Rubrics</option>
              </select>
            </div>
          </div>

          {/* Danh sách rubric đã lưu */}
          {savedRubrics.length > 0 && (
            <div className="mb-4">
              <label className="block text-sm font-medium">Tải Rubric đã lưu</label>
              <select
                onChange={(e) => {
                  const rubric = savedRubrics[e.target.value];
                  if (rubric) loadSavedRubric(rubric);
                }}
                className="mt-1 block w-full border rounded-md p-2"
              >
                <option value="">Chọn rubric...</option>
                {savedRubrics.map((rubric, index) => (
                  <option key={index} value={index}>
                    {rubric.title}
                  </option>
                ))}
              </select>
            </div>
          )}

          {/* Quản lý Chuẩn Đầu Ra */}
          <div className="mb-4">
            <h3 className="text-lg font-medium mb-2">Quản lý Chuẩn Đầu Ra</h3>
            <div className="flex mb-2">
              <input
                type="text"
                value={newOutcomeName}
                onChange={(e) => setNewOutcomeName(e.target.value)}
                className="border rounded-md p-2 mr-2 flex-grow"
                placeholder="Nhập tên Chuẩn Đầu Ra..."
              />
              <button
                onClick={addOutcome}
                className="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600"
              >
                Thêm CĐR
              </button>
            </div>
            {outcomes.length > 0 && (
              <table className="w-full border-collapse mb-4">
                <thead>
                  <tr>
                    <th className="border p-2">Tên CĐR</th>
                    <th className="border p-2">Hành động</th>
                  </tr>
                </thead>
                <tbody>
                  {outcomes.map((outcome) => (
                    <tr key={outcome.id}>
                      <td className="border p-2">
                        <input
                          type="text"
                          value={outcome.name}
                          onChange={(e) => updateOutcome(outcome.id, e.target.value)}
                          className="w-full border rounded-md p-1"
                        />
                      </td>
                      <td className="border p-2 text-center">
                        <button
                          onClick={() => removeOutcome(outcome.id)}
                          className="text-red-500 text-sm"
                        >
                          Xóa
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>

          {/* Gợi ý tiêu chí */}
          <div className="mb-4">
            <label className="block text-sm font-medium">Loại bài tập</label>
            <select
              value={assignmentType}
              onChange={(e) => setAssignmentType(e.target.value)}
              className="mt-1 block w-full border rounded-md p-2"
            >
              <option value="essay">Bài luận</option>
              <option value="presentation">Thuyết trình</option>
              <option value="project">Dự án nhóm</option>
              <option value="lab">Thực hành thí nghiệm</option>
              <option value="internship">Thực tập doanh nghiệp</option>
              <option value="thesis">Khóa luận/Luận văn</option>
            </select>
            <div className="mt-2">
              <p className="text-sm font-medium">Gợi ý tiêu chí:</p>
              <div className="flex flex-wrap gap-2 mt-1">
                {suggestedCriteria[assignmentType].map((criterion, index) => (
                  <button
                    key={index}
                    onClick={() => addSuggestedCriterion(criterion)}
                    className="bg-gray-200 text-sm px-3 py-1 rounded hover:bg-gray-300"
                  >
                    {criterion}
                  </button>
                ))}
              </div>
            </div>
            {framework === "blooms" && (
              <div className="mt-4">
                <p className="text-sm font-medium">Gợi ý từ Bloom’s Taxonomy:</p>
                <div className="flex flex-wrap gap-2 mt-1">
                  {Object.keys(bloomsTaxonomy).map((key) => (
                    <button
                      key={key}
                      onClick={() => addBloomsCriterion(key)}
                      className="bg-blue-200 text-sm px-3 py-1 rounded hover:bg-blue-300"
                    >
                      {bloomsTaxonomy[key].name}
                    </button>
                  ))}
                </div>
              </div>
            )}
            {framework === "aacu" && (
              <div className="mt-4">
                <p className="text-sm font-medium">Gợi ý từ AAC&U VALUE Rubrics:</p>
                <div className="flex flex-wrap gap-2 mt-1">
                  {Object.keys(aacuValueRubrics).map((key) => (
                    <button
                      key={key}
                      onClick={() => addAacuCriterion(key)}
                      className="bg-green-200 text-sm px-3 py-1 rounded hover:bg-green-300"
                    >
                      {aacuValueRubrics[key].name}
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* Bảng rubric */}
          <div className="overflow-x-auto">
            {rubricType === "holistic" ? (
              criteria.map((criterion, criterionIdx) => (
                <div key={criterionIdx} className="mb-6">
                  <div className="flex items-center mb-2">
                    <input
                      type="text"
                      value={criterion.name}
                      onChange={(e) => updateCriterion(criterionIdx, "name", e.target.value)}
                      className="w-1/2 border rounded-md p-2 mr-2"
                    />
                    <button
                      onClick={() => removeCriterion(criterionIdx)}
                      className="text-red-500 text-sm"
                    >
                      Xóa Tiêu chí
                    </button>
                  </div>
                  <table className="w-full border-collapse">
                    <thead>
                      <tr>
                        <th className="border p-2">Ngưỡng đạt (%)</th>
                        <th className="border p-2">Liên quan đến CĐR</th>
                        <th className="border p-2">Mức chất lượng</th>
                        <th className="border p-2">Thang điểm</th>
                        <th className="border p-2">Mô tả mức chất lượng</th>
                      </tr>
                    </thead>
                    <tbody>
                      {levels.map((level, levelIdx) => (
                        <tr key={levelIdx}>
                          {levelIdx === 0 && (
                            <>
                              <td className="border p-2" rowSpan={levels.length}>
                                <input
                                  type="number"
                                  value={criterion.threshold}
                                  onChange={(e) => updateCriterion(criterionIdx, "threshold", e.target.value)}
                                  className="w-full text-center"
                                  min="0"
                                  max="100"
                                />
                              </td>
                              <td className="border p-2" rowSpan={levels.length}>
                                {outcomes.map((outcome) => (
                                  <div key={outcome.id} className="flex items-center mb-1">
                                    <input
                                      type="checkbox"
                                      checked={(criterion.relatedOutcomes || []).includes(outcome.id)}
                                      onChange={(e) =>
                                        updateCriterionOutcomes(criterionIdx, outcome.id, e.target.checked)
                                      }
                                      className="mr-2"
                                    />
                                    <span>{outcome.name}</span>
                                  </div>
                                ))}
                              </td>
                            </>
                          )}
                          <td className="border p-2">
                            <input
                              type="text"
                              value={level}
                              onChange={(e) => {
                                const newLevels = [...levels];
                                newLevels[levelIdx] = e.target.value;
                                setLevels(newLevels);
                              }}
                              className="w-full text-center"
                            />
                            <button
                              onClick={() => removeLevel(levelIdx)}
                              className="text-red-500 text-sm mt-1"
                            >
                              Xóa
                            </button>
                          </td>
                          <td className="border p-2">
                            <input
                              type="number"
                              value={
                                criterion.scores
                                  ? criterion.scores[levelIdx]
                                  : levels.length - levelIdx - 1
                              }
                              onChange={(e) => updateScore(criterionIdx, levelIdx, e.target.value)}
                              className="w-full text-center"
                              min="0"
                            />
                          </td>
                          <td className="border p-2">
                            <textarea
                              value={criterion.descriptions[levelIdx]}
                              onChange={(e) => updateDescription(criterionIdx, levelIdx, e.target.value)}
                              className="w-full h-20 resize-none"
                              placeholder="Nhập mô tả..."
                            />
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              ))
            ) : (
              <table className="w-full border-collapse">
                <thead>
                  <tr>
                    <th className="border p-2">Tiêu chí</th>
                    <th className="border p-2">Trọng số (%)</th>
                    <th className="border p-2">Ngưỡng đạt (%)</th>
                    <th className="border p-2">Liên quan đến CĐR</th>
                    {levels.map((level, index) => (
                      <th key={index} className="border p-2">
                        <input
                          type="text"
                          value={level}
                          onChange={(e) => {
                            const newLevels = [...levels];
                            newLevels[index] = e.target.value;
                            setLevels(newLevels);
                          }}
                          className="w-full text-center"
                        />
                        <button
                          onClick={() => removeLevel(index)}
                          className="text-red-500 text-sm mt-1"
                        >
                          Xóa
                        </button>
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {criteria.map((criterion, criterionIndex) => (
                    <tr key={criterionIndex}>
                      <td className="border p-2">
                        <input
                          type="text"
                          value={criterion.name}
                          onChange={(e) => updateCriterion(criterionIndex, "name", e.target.value)}
                          className="w-full"
                        />
                        <button
                          onClick={() => removeCriterion(criterionIndex)}
                          className="text-red-500 text-sm mt-1"
                        >
                          Xóa
                        </button>
                      </td>
                      <td className="border p-2">
                        <input
                          type="number"
                          value={criterion.weight}
                          onChange={(e) => updateCriterion(criterionIndex, "weight", e.target.value)}
                          className="w-full text-center"
                          min="0"
                          max="100"
                        />
                      </td>
                      <td className="border p-2">
                        <input
                          type="number"
                          value={criterion.threshold}
                          onChange={(e) => updateCriterion(criterionIndex, "threshold", e.target.value)}
                          className="w-full text-center"
                          min="0"
                          max="100"
                        />
                      </td>
                      <td className="border p-2">
                        {outcomes.map((outcome) => (
                          <div key={outcome.id} className="flex items-center mb-1">
                            <input
                              type="checkbox"
                              checked={(criterion.relatedOutcomes || []).includes(outcome.id)}
                              onChange={(e) =>
                                updateCriterionOutcomes(criterionIndex, outcome.id, e.target.checked)
                              }
                              className="mr-2"
                            />
                            <span>{outcome.name}</span>
                          </div>
                        ))}
                      </td>
                      {criterion.descriptions.map((desc, levelIndex) => (
                        <td key={levelIndex} className="border p-2">
                          <textarea
                            value={desc}
                            onChange={(e) => updateDescription(criterionIndex, levelIndex, e.target.value)}
                            className="w-full h-20 resize-none"
                            placeholder="Nhập mô tả..."
                          />
                        </td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>

          {/* Hiển thị tổng trọng số (cho định lượng) */}
          {rubricType === "analytic" && (
            <div className="mt-2">
              <p className={`text-sm ${isWeightValid ? "text-green-500" : "text-red-500"}`}>
                Tổng trọng số: {totalWeight}% {isWeightValid ? "(Hợp lệ)" : "(Phải bằng 100%)"}
              </p>
            </div>
          )}

          {/* Nút hành động */}
          <div className="mt-8 flex space-x-4">
            <button
              onClick={addCriterion}
              className="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
            >
              Thêm Tiêu chí
            </button>
            <button
              onClick={addLevel}
              className="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
            >
              Thêm Mức độ
            </button>
            <button
              onClick={clearAll}
              className="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600"
            >
              Xóa Tất Cả
            </button>
            <button
              onClick={saveRubric}
              className="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600"
            >
              Lưu Rubric
            </button>
            <button
              onClick={exportToWord}
              className="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
            >
              Tải Word
            </button>
          </div>
        </div>
      );

      const MeasurementTab = () => (
        <div>
          <h2 className="text-xl font-bold mb-4">Đo Lường Chuẩn Đầu Ra</h2>

          {/* Quản lý sinh viên và điểm số */}
          <div className="mb-4">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
              <div>
                <label className="block text-sm font-medium">Họ Tên Sinh Viên</label>
                <input
                  type="text"
                  value={studentFullName}
                  onChange={(e) => setStudentFullName(e.target.value)}
                  className="mt-1 block w-full border rounded-md p-2"
                  placeholder="Nhập họ tên sinh viên..."
                />
              </div>
              <div>
                <label className="block text-sm font-medium">Mã số sinh viên</label>
                <input
                  type="text"
                  value={studentId}
                  onChange={(e) => setStudentId(e.target.value)}
                  className="mt-1 block w-full border rounded-md p-2"
                  placeholder="Nhập mã số sinh viên..."
                />
              </div>
              {rubricType === "analytic" && (
                <div>
                  <label className="block text-sm font-medium">Điểm tối đa mỗi tiêu chí</label>
                  <input
                    type="number"
                    value={maxScore}
                    onChange={(e) => setMaxScore(parseFloat(e.target.value) || 10)}
                    className="mt-1 block w-full border rounded-md p-2"
                    min="1"
                  />
                </div>
              )}
            </div>
            <button
              onClick={addStudent}
              className="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 mb-4"
            >
              Thêm Sinh Viên
            </button>
          </div>

          {students.length > 0 && (
            <div className="overflow-x-auto">
              <h3 className="text-lg font-medium mb-2">Bảng Điểm Sinh Viên</h3>
              <table className="w-full border-collapse mb-4">
                <thead>
                  <tr>
                    <th className="border p-2">Họ Tên Sinh Viên</th>
                    <th className="border p-2">Mã số sinh viên
              <th className="border p-2">Mã số sinh viên</th>
                    {rubricType === "holistic" ? (
                      <th className="border p-2">Mức chất lượng</th>
                    ) : (
                      criteria.map((criterion, index) => (
                        <th key={index} className="border p-2">
                          {criterion.name}
                        </th>
                      ))
                    )}
                    <th className="border p-2">Tổng điểm</th>
                    <th className="border p-2">Hành động</th>
                  </tr>
                </thead>
                <tbody>
                  {students.map((student) => (
                    <tr key={student.id}>
                      <td className="border p-2">{student.fullName}</td>
                      <td className="border p-2">{student.studentId}</td>
                      {rubricType === "holistic" ? (
                        <td className="border p-2">
                          <select
                            value={studentScores[student.id]?.level || ""}
                            onChange={(e) =>
                              updateStudentScore(student.id, 0, e.target.value)
                            }
                            className="w-full border rounded-md p-1"
                          >
                            <option value="">Chọn mức...</option>
                            {levels.map((level, index) => (
                              <option key={index} value={index}>
                                {level}
                              </option>
                            ))}
                          </select>
                        </td>
                      ) : (
                        criteria.map((_, index) => (
                          <td key={index} className="border p-2">
                            <input
                              type="number"
                              value={studentScores[student.id]?.[index] || ""}
                              onChange={(e) =>
                                updateStudentScore(student.id, index, e.target.value)
                              }
                              className="w-full text-center border rounded-md p-1"
                              min="0"
                              max={maxScore}
                            />
                          </td>
                        ))
                      )}
                      <td className="border p-2 text-center">
                        {calculateStudentScore(student.id).toFixed(2)}
                      </td>
                      <td className="border p-2 text-center">
                        <button
                          onClick={() => removeStudent(student.id)}
                          className="text-red-500 text-sm"
                        >
                          Xóa
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>

              {/* Kết quả Chuẩn Đầu Ra */}
              {outcomes.map((outcome) => (
                <div key={outcome.id} className="mb-6">
                  <h3 className="text-lg font-medium mb-2">{outcome.name}</h3>
                  <p className="mb-2">
                    Tiêu chí liên quan:{" "}
                    {outcome.relatedCriteria
                      .map((idx) => criteria[idx]?.name)
                      .filter((name) => name)
                      .join(", ") || "Không có"}
                  </p>
                  <table className="w-full border-collapse mb-2">
                    <thead>
                      <tr>
                        <th className="border p-2">Họ Tên Sinh Viên</th>
                        <th className="border p-2">Mã số sinh viên</th>
                        <th className="border p-2">Đạt CĐR</th>
                      </tr>
                    </thead>
                    <tbody>
                      {students.map((student) => (
                        <tr key={student.id}>
                          <td className="border p-2">{student.fullName}</td>
                          <td className="border p-2">{student.studentId}</td>
                          <td className="border p-2 text-center">
                            {isStudentPassingOutcome(student.id, outcome)
                              ? "Đạt"
                              : "Không đạt"}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  <p className="text-sm font-medium">
                    Tỉ lệ sinh viên đạt {outcome.name}:{" "}
                    {getOutcomeAchievementRate(outcome)}%
                  </p>
                </div>
              ))}
            </div>
          )}
        </div>
      );

      // Giao diện chính với 2 tab
      return (
        <div className="bg-white p-6 rounded-lg shadow-lg">
          <h1 className="text-2xl font-bold mb-6">
            Công cụ Tạo Rubric và Đo Lường Chuẩn Đầu Ra - HCM USSH
          </h1>
          <div className="mb-4">
            <div className="flex border-b">
              <button
                className={`px-4 py-2 font-medium ${
                  activeTab === "design"
                    ? "border-b-2 border-blue-500 text-blue-500"
                    : "text-gray-500"
                }`}
                onClick={() => setActiveTab("design")}
              >
                Thiết kế Rubric
              </button>
              <button
                className={`px-4 py-2 font-medium ${
                  activeTab === "measurement"
                    ? "border-b-2 border-blue-500 text-blue-500"
                    : "text-gray-500"
                }`}
                onClick={() => setActiveTab("measurement")}
              >
                Đo lường Chuẩn Đầu Ra
              </button>
            </div>
          </div>
          {activeTab === "design" ? <DesignTab /> : <MeasurementTab />}
        </div>
      );
    };

    // Render ứng dụng
    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
